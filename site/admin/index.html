<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>IRIS Cold Emailing · Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f5f7fb;--surface:#fff;--fg:#14233f;--muted:#5c6b83;--line:#d8e0ed;--navy:#0f3a7d;--orange:#ea8a2f;--ok:#1b6e45;--warn:#8a4b06;--bad:#a3231c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 'DM Sans',sans-serif}.head{background:var(--navy);color:white;padding:28px 20px}.wrap{max-width:1180px;margin:auto}.brand{font:800 20px 'Sora';letter-spacing:2px}.brand i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--orange);margin-right:9px}h1,h2{font-family:'Sora';margin:0}h1{font-size:28px;margin-top:12px}.sub{color:#dce6f5;margin:6px 0 0}.main{padding:24px 20px 60px}.login,.card,.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}.login{display:flex;gap:10px;flex-wrap:wrap}input{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;min-width:260px;flex:1}button,.btn{font:700 14px 'DM Sans';padding:10px 13px;border-radius:8px;border:1px solid var(--line);background:white;color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--orange);border-color:var(--orange)}.danger{border-color:#e0a5a2;color:var(--bad)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-top:18px}.card{display:flex;flex-direction:column;gap:13px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.top h2{font-size:18px;color:var(--navy)}.badge{padding:3px 9px;border-radius:999px;font-weight:700;font-size:12px;background:#edf2f8}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.meta{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#eef3fa;border-radius:9px;padding:9px}.stat b{display:block;font:700 20px 'Sora'}.actions{display:flex;flex-wrap:wrap;gap:8px}.sep{border-top:1px solid var(--line);padding-top:12px}.status{font-weight:700}.note{font-size:12.5px;color:var(--muted)}#msg{margin:12px 0;color:var(--muted)}
@media(max-width:600px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.actions .btn,.actions button{flex:1 1 46%}}
</style></head><body>
<div class="head"><div class="wrap"><div class="brand"><i></i>IRIS · COLD EMAILING</div><h1>Onboarding & pilotage admin</h1><p class="sub">Tous les clients, leurs liens privés, leurs validations et leurs envois depuis un seul cockpit.</p></div></div>
<main class="main wrap">
<form class="login" id="login"><input id="cle" type="password" placeholder="Clé admin" autocomplete="current-password"><button class="primary">Ouvrir le cockpit</button></form>
<p id="msg"></p><div id="resume"></div><div class="grid" id="grid"></div>
</main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let CLE="",DATA={};
function lien(code){return location.origin+"/e/"+code}
function etat(x){if(x.etat==="marche")return '<span class="badge ok">En marche</span>';if(x.etat==="pause")return '<span class="badge warn">En pause</span>';if(x.etat==="preparation")return '<span class="badge warn">Préparation</span>';return '<span class="badge">À l’arrêt</span>'}
function carte(code,x){const c=x.config||{};return `<article class="card" data-code="${code}">
<div class="top"><div><h2>${esc(x.client)}</h2><div class="meta">${esc(x.dossier||"")}</div></div>${etat(x)}</div>
<div class="stats"><div class="stat"><b>${x.contactes||0}</b><span>contactés</span></div><div class="stat"><b>${x.reponses||0}</b><span>réponses</span></div><div class="stat"><b>${x.attente||0}</b><span>à valider</span></div></div>
<div class="meta">${c.boite?esc(c.boite):"Boîte email non renseignée"}<br>${c.mode==="autonome"?"Pilotage IRIS autonome":"Validation par le client"} · ${c.envoi?"envois ouverts":"envois fermés"} · ${c.actif?"client actif":"client inactif"}</div>
<div class="actions sep"><a class="btn primary" href="/e/${code}" target="_blank">Voir comme le client</a><button data-copy="${code}">Copier le lien client</button></div>
<div class="actions"><button data-act="donner_main">Donner la main au client</button><button data-act="pilotage_iris">Pilotage IRIS</button></div>
<div class="actions"><button data-act="${c.envoi?"fermer_envois":"ouvrir_envois"}" class="${c.envoi?"danger":""}">${c.envoi?"Fermer les envois":"Ouvrir les envois"}</button><button data-act="${c.actif?"desactiver_client":"activer_client"}">${c.actif?"Désactiver":"Activer le client"}</button><button data-act="${x.etat==="pause"?"reprise":"pause"}">${x.etat==="pause"?"Reprendre":"Mettre en pause"}</button></div>
<div class="note">Lien privé : ${esc(lien(code))}</div></article>`}
function render(){const codes=Object.keys(DATA).sort((a,b)=>(DATA[b].attente-DATA[a].attente)||DATA[a].client.localeCompare(DATA[b].client));$("#grid").innerHTML=codes.map(c=>carte(c,DATA[c])).join("");const actifs=codes.filter(c=>DATA[c].config?.actif).length;const attente=codes.reduce((n,c)=>n+(DATA[c].attente||0),0);$("#resume").innerHTML=`<div class="summary"><b>${codes.length} clients</b> · ${actifs} actifs · ${attente} validation(s) en attente. <span class="note">L’ouverture des envois est volontairement séparée du mode de pilotage.</span></div>`}
async function charger(){$("#msg").textContent="Chargement…";const r=await fetch("/api/espace?console=1",{headers:{"x-cle":CLE},cache:"no-store"});if(!r.ok){$("#msg").textContent=r.status===403?"Clé admin refusée.":"Console indisponible.";return}DATA=await r.json();try{sessionStorage.setItem("iris-admin",CLE)}catch(e){}$("#login").hidden=true;$("#msg").textContent="";render()}
async function agir(code,action,b){b.disabled=true;const r=await fetch("/api/espace",{method:"POST",headers:{"content-type":"application/json","x-cle":CLE},body:JSON.stringify({admin:true,code,action})});if(!r.ok){alert("Action non enregistrée.");b.disabled=false;return}$("#msg").textContent="Action enregistrée. Elle sera visible après le prochain passage du moteur.";setTimeout(charger,500)}
document.addEventListener("click",async e=>{const cp=e.target.closest("[data-copy]");if(cp){await navigator.clipboard.writeText(lien(cp.dataset.copy));cp.textContent="Lien copié";setTimeout(()=>cp.textContent="Copier le lien client",1200);return}const b=e.target.closest("[data-act]");if(b){const card=b.closest("[data-code]");agir(card.dataset.code,b.dataset.act,b)}})
$("#login").addEventListener("submit",e=>{e.preventDefault();CLE=$("#cle").value.trim();charger()});try{const c=sessionStorage.getItem("iris-admin");if(c){CLE=c;charger()}}catch(e){}
</script></body></html>
