<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Console IRIS cold emailing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#F5F7FB;--surface:#fff;--fg:#14233F;--muted:#4A5A75;--line:#D3DDED;--brand:#0F3A7D;--head-bg:#0F3A7D;--head-muted:#DCE6F5;--accent:#EA8A2F;--ok:#1B6E45;--wait:#8A4B06}
@media(prefers-color-scheme:dark){:root{--bg:#0B1424;--surface:#121E33;--fg:#E8EEF8;--muted:#A9B8D0;--line:#2A3B57;--brand:#9DBDF5;--head-bg:#0A2A5C;--head-muted:#C9D8F0;--accent:#F0A050;--ok:#6FD3A0;--wait:#F5C07A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 'DM Sans','Segoe UI',system-ui,sans-serif}
.head{background:var(--head-bg);color:#fff}.head div{max-width:1040px;margin:0 auto;padding:28px 20px 30px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font:800 20px 'Sora','Segoe UI',sans-serif;letter-spacing:3px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent)}.brand small{font:500 14px 'DM Sans',sans-serif;letter-spacing:0;color:var(--head-muted)}
main{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:24px 56px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font:700 clamp(24px,4vw,32px)/1.2 'Sora','Segoe UI',sans-serif}
.petit{color:var(--muted);font-size:14px;margin:0}
form{display:flex;gap:10px;flex-wrap:wrap}
input{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0;flex:1 1 220px}
button{font:inherit;font-weight:700;padding:11px 18px;min-height:44px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:#14233F;cursor:pointer}
a.client{display:grid;grid-template-columns:1fr auto;gap:4px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;color:inherit;text-decoration:none}
a.client:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a.client b{color:var(--brand);font:700 17px 'Sora','Segoe UI',sans-serif}
.urgent{color:var(--wait);font-weight:700}.ok{color:var(--ok);font-weight:700}.pause{color:var(--wait);font-weight:700}
</style></head><body><div class="head"><div><div class="brand"><i></i>IRIS <small>Prospection cold emailing</small></div><h1>Console du pilote</h1></div></div>
<main>
<form id="f"><input id="cle" type="password" placeholder="Clé de la console" aria-label="Clé de la console" autocomplete="current-password"><button>Ouvrir</button></form>
<p class="petit" id="msg"></p>
<div id="liste" style="display:flex;flex-direction:column;gap:10px"></div>
</main><script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg = document.getElementById("msg"), liste = document.getElementById("liste"), champ = document.getElementById("cle");
async function ouvrir(cle){
  msg.textContent = "Chargement…";
  let r; try { r = await fetch("/api/espace?console=1", {headers: {"x-cle": cle}, cache: "no-store"}); } catch (e) { msg.textContent = "Le site ne répond pas."; return; }
  if (!r.ok) { msg.textContent = r.status === 403 ? "Clé refusée." : "Console indisponible."; return; }
  try { sessionStorage.setItem("cle", cle); } catch (e) {}
  const d = await r.json(), codes = Object.keys(d).sort((a, b) => (d[b].attente - d[a].attente) || d[a].client.localeCompare(d[b].client));
  document.getElementById("f").hidden = true;
  msg.textContent = codes.length ? "Les clients qui attendent un accord sont en haut." : "Aucun client pour l'instant.";
  liste.innerHTML = codes.map(c => { const x = d[c]; const etat = x.etat === "marche" ? '<span class="ok">En marche</span>' : x.etat === "pause" ? `<span class="pause">En pause : ${esc(x.motif)}</span>` : x.etat === "preparation" ? '<span class="pause">En préparation</span>' : '<span class="petit">À l\'arrêt</span>';
    return `<a class="client" href="/e/${c}"><b>${esc(x.client)}</b>${etat}
      <span class="petit">${x.contactes} contactés · ${x.reponses} réponse${x.reponses > 1 ? "s" : ""} · aujourd'hui ${x.jour.partis} / ${x.jour.plafond}</span>
      <span class="${x.attente ? "urgent" : "petit"}">${x.attente ? x.attente + " à valider" : "rien à valider"}</span></a>`; }).join("");
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); ouvrir(champ.value.trim()); });
try { const c = sessionStorage.getItem("cle"); if (c) ouvrir(c); } catch (e) {}
</script></body></html>
