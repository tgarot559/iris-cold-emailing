# Fait tourner le moteur toutes les demi-heures en semaine.
# Le moteur décide lui-même s'il est l'heure d'envoyer (heure de Paris, plafonds, écarts).
name: passage
on:
  schedule:
    - cron: "7,37 6-16 * * 1-5"
  workflow_dispatch:
concurrency:
  group: passage
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python -m moteur passage --tous
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_COLDMAIL_MODEL: gpt-4.1-mini
          SGAI_API_KEY: ${{ secrets.SGAI_API_KEY }}
          COLDMAIL_MAIL_PASSWORDS: ${{ secrets.COLDMAIL_MAIL_PASSWORDS }}
          COLDMAIL_PASSWORD_VERIFAMENDE_FLOTTES: ${{ secrets.COLDMAIL_SECRETS }}
          COLDMAIL_PASSWORD_ALEXANDRE_BELLANGER: ${{ secrets.COLDMAIL_PASSWORD_ALEXANDRE_BELLANGER }}
          COLDMAIL_PASSWORD_LAURENT_VICHERD: ${{ secrets.COLDMAIL_PASSWORD_LAURENT_VICHERD }}
          COLDMAIL_PASSWORD_LIONEL_SEGARD: ${{ secrets.COLDMAIL_PASSWORD_LIONEL_SEGARD }}
          COLDMAIL_PASSWORD_LISA_EASY_LEARNING: ${{ secrets.COLDMAIL_PASSWORD_LISA_EASY_LEARNING }}
          COLDMAIL_PASSWORD_WILLY_FOUCHER: ${{ secrets.COLDMAIL_PASSWORD_WILLY_FOUCHER }}
      - name: Enregistrer l'état
        if: always()
        run: |
          git config user.name "moteur"
          git config user.email "moteur@users.noreply.github.com"
          git add clients espaces credits.json 2>/dev/null || git add clients
          git diff --cached --quiet || git commit -q -m "[CF-Pages-Skip] passage $(date -u +%FT%H:%MZ)"
          git pull -q --rebase
          git push -q
